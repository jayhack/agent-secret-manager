<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>agent-secret-manager header</title>
  <link rel="preconnect" href="https://rsms.me" crossorigin>
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { background: transparent; }

    .stage {
      width: 1280px;
      height: 400px;
      position: relative;
      overflow: hidden;
      background: #fbfbff;
      background-image:
        radial-gradient(ellipse 70% 60% at 14% -5%, rgba(124, 92, 255, 0.30), transparent 60%),
        radial-gradient(ellipse 65% 55% at 90% 8%, rgba(80, 130, 255, 0.22), transparent 60%),
        radial-gradient(ellipse 80% 65% at 92% 102%, rgba(155, 110, 255, 0.26), transparent 65%),
        radial-gradient(ellipse 75% 60% at 5% 100%, rgba(110, 165, 255, 0.20), transparent 65%),
        linear-gradient(180deg, #ffffff 0%, #fafaff 60%, #f1efff 100%);
      font-family: "Inter", "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 56px;
      padding: 0 110px;
    }

    .lock {
      width: 168px;
      height: 168px;
      filter: drop-shadow(0 18px 36px rgba(111, 92, 255, 0.32));
    }

    h1 {
      font-size: 72px;
      line-height: 1.0;
      font-weight: 700;
      letter-spacing: -0.030em;
      color: #0f1020;
      margin: 0 0 14px;
    }

    .sub {
      font-size: 28px;
      line-height: 1.3;
      font-weight: 500;
      letter-spacing: -0.012em;
      color: #5a5a72;
      margin: 0;
    }

    .accent {
      background: linear-gradient(95deg, #6f5cff 0%, #8a6cff 50%, #b48bff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body>
  <div class="stage">
    <svg class="lock" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="lockGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#6f5cff"/>
          <stop offset="100%" stop-color="#b48bff"/>
        </linearGradient>
      </defs>
      <path d="M64 88V56a36 36 0 0 1 72 0v32"
            stroke="url(#lockGrad)" stroke-width="20"
            stroke-linecap="round" fill="none"/>
      <rect x="32" y="84" width="136" height="100" rx="22" fill="url(#lockGrad)"/>
      <circle cx="100" cy="128" r="11" fill="white"/>
      <path d="M100 128v22" stroke="white" stroke-width="9" stroke-linecap="round"/>
    </svg>
    <div class="text">
      <h1>agent-secret-manager</h1>
      <p class="sub">securely share secrets with <span class="accent">coding agents</span></p>
    </div>
  </div>
</body>
</html>
