<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>agent-secret-manager header</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@500;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { background: transparent; }

    :root {
      --obsidian: #0b0712;
      --basalt: #17111f;
      --teal: #16e6c4;
      --solar: #ffc24a;
      --ember: #ff6a2c;
      --hibiscus: #ff2e76;
      --orchid: #7a2be0;
      --moonlight: #f6ecdd;
    }

    .stage {
      width: 1280px;
      height: 400px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 86% -8%, rgba(255, 194, 74, 0.28), transparent 28rem),
        radial-gradient(circle at 14% -6%, rgba(122, 43, 224, 0.34), transparent 30rem),
        radial-gradient(circle at 68% 40%, rgba(255, 46, 118, 0.16), transparent 34rem),
        var(--obsidian);
      font-family: "Inter", "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 56px;
      padding: 0 110px;
      color: var(--moonlight);
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: repeating-linear-gradient(0deg, transparent 0 5px, rgba(246, 236, 221, 0.04) 5px 6px);
    }

    .sun-disc {
      position: absolute;
      right: -96px;
      top: -184px;
      width: 520px;
      height: 520px;
      border-radius: 999px;
      background: radial-gradient(circle at 50% 50%, #ffc24a 0%, #ff6a2c 34%, #ff2e76 62%, rgba(122, 43, 224, 0) 76%);
      opacity: 0.74;
    }

    .acid-rings {
      position: absolute;
      left: -210px;
      top: -50px;
      width: 540px;
      height: 540px;
      opacity: 0.26;
      background-image: repeating-radial-gradient(
        circle at 50% 50%,
        transparent 0 17px,
        rgba(122, 43, 224, 0.5) 17px 18px,
        transparent 18px 34px,
        rgba(255, 46, 118, 0.4) 34px 35px,
        transparent 35px 52px,
        rgba(255, 106, 44, 0.35) 52px 53px,
        transparent 53px
      );
    }

    .mark {
      position: relative;
      z-index: 1;
      width: 152px;
      height: 238px;
      color: var(--teal);
      filter: drop-shadow(0 0 18px rgba(22, 230, 196, 0.62));
    }

    .text {
      position: relative;
      z-index: 1;
    }

    h1 {
      font-family: "Space Grotesk", "Helvetica Neue", system-ui, sans-serif;
      font-size: 76px;
      line-height: 0.94;
      font-weight: 700;
      letter-spacing: -0.035em;
      color: var(--moonlight);
      margin: 0 0 18px;
    }

    .accent { color: var(--teal); }

    .sub {
      font-size: 28px;
      line-height: 1.28;
      font-weight: 700;
      color: rgba(246, 236, 221, 0.76);
      margin: 0;
    }

    .notch-row {
      width: 260px;
      height: 9px;
      margin-top: 28px;
      background: var(--teal);
      opacity: 0.86;
      -webkit-mask: repeating-linear-gradient(90deg, #000 0 2px, transparent 2px 11px);
      mask: repeating-linear-gradient(90deg, #000 0 2px, transparent 2px 11px);
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="sun-disc" aria-hidden="true"></div>
    <div class="acid-rings" aria-hidden="true"></div>
    <svg class="mark" viewBox="0 0 64 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect x="8" y="4" width="48" height="66" rx="9" stroke="currentColor" stroke-width="3"/>
      <path d="M13 27 L32 17 L51 27" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="23" cy="40" r="7" stroke="currentColor" stroke-width="2.6"/>
      <circle cx="23" cy="40" r="2.4" fill="currentColor"/>
      <circle cx="41" cy="40" r="7" stroke="currentColor" stroke-width="2.6"/>
      <circle cx="41" cy="40" r="2.4" fill="currentColor"/>
      <path d="M32 44 L27 57 L37 57 Z" fill="currentColor"/>
      <rect x="18" y="60" width="28" height="9" rx="2" stroke="currentColor" stroke-width="2.4"/>
      <path d="M27 60 L27 69 M32 60 L32 69 M37 60 L37 69" stroke="currentColor" stroke-width="1.6"/>
      <path d="M16 78 H48 M16 86 H48 M16 94 H48" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
    </svg>
    <div class="text">
      <h1>agent-secret-manager</h1>
      <p class="sub">securely share secrets with <span class="accent">coding agents</span></p>
      <div class="notch-row"></div>
    </div>
  </div>
</body>
</html>
